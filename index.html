<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atlas | Investment and Portfolio Management</title>
<style>
  :root{
    --navy:#231f20; --navy2:#332d2e; --navy3:#48393a;
    --accent:#a2823c; --accent-d:#85682e;
    --amber:#d97706; --red:#dc2626; --sky:#2563eb; --violet:#7c3aed;
    --ink:#231f20; --slate:#5b5457; --mut:#9a9498; --line:#eae5e2;
    --bg:#faf7f4; --card:#ffffff;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5}
  button{font-family:inherit;cursor:pointer}
  .mono{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
  /* ---------- login ---------- */
  .login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
    background:var(--navy)}
  .login-card{background:var(--card);border-radius:18px;max-width:760px;width:100%;padding:32px;box-shadow:0 30px 80px rgba(2,12,30,.45)}
  .brand-row{display:flex;align-items:center;gap:12px;margin-bottom:4px}
  .logo{width:40px;height:40px;border-radius:11px;background:var(--accent);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:18px}
  .login-card h1{font-size:20px;margin:0}
  .login-card .sub{color:var(--slate);font-size:13px;margin:2px 0 0}
  .demo-note{margin:14px 0 18px;font-size:12px;color:var(--slate);background:#f5f1e9;border:1px solid var(--line);padding:9px 12px;border-radius:9px}
  .role-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  @media(max-width:640px){.role-grid{grid-template-columns:1fr}}
  .role-card{text-align:left;border:1px solid var(--line);border-radius:12px;padding:14px;background:#fff;transition:.15s;display:flex;flex-direction:column;gap:6px}
  .role-card:hover{border-color:var(--accent);box-shadow:0 6px 18px rgba(162,130,60,.14);transform:translateY(-1px)}
  .role-card .rn{font-weight:700;font-size:13.5px}
  .role-card .rd{font-size:11.5px;color:var(--slate);min-height:32px}
  .role-card .re{font-size:11px;color:var(--accent-d);font-weight:600}
  /* ---------- app shell ---------- */
  .shell{display:flex;min-height:100vh}
  .side{width:230px;background:var(--navy);color:#dfdbd2;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
  .side .head{height:60px;display:flex;align-items:center;gap:10px;padding:0 16px;border-bottom:1px solid rgba(255,255,255,.08)}
  .side .head .t{font-weight:700;color:#fff;font-size:15px;line-height:1.1}
  .side .head .s{font-size:10.5px;color:#bcb5a6}
  nav.menu{flex:1;padding:10px;overflow-y:auto}
  .navitem{display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:none;border:0;color:#d1cbbb;padding:9px 11px;border-radius:9px;font-size:13.5px;margin-bottom:2px}
  .navitem:hover{background:rgba(255,255,255,.07);color:#fff}
  .navitem.active{background:var(--navy3);color:#fff;font-weight:600}
  .navitem .ic{width:18px;text-align:center;font-size:15px}
  .navitem .badge{margin-left:auto;background:var(--accent);color:#fff;font-size:10.5px;font-weight:700;border-radius:10px;padding:1px 7px}
  .side .foot{padding:12px 14px;border-top:1px solid rgba(255,255,255,.08);font-size:11px;color:#bcb5a6}
  .main{flex:1;min-width:0;display:flex;flex-direction:column}
  .top{height:60px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 20px;position:sticky;top:0;z-index:20}
  .top h2{font-size:16px;margin:0;font-weight:700}
  .top .crumb{font-size:11.5px;color:var(--mut)}
  .spacer{flex:1}
  .seg{display:flex;background:#f5f1e9;border:1px solid var(--line);border-radius:9px;padding:2px}
  .seg button{border:0;background:none;padding:5px 10px;border-radius:7px;font-size:12px;color:var(--slate);font-weight:600}
  .seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
  .iconbtn{position:relative;border:1px solid var(--line);background:#fff;border-radius:9px;width:36px;height:34px;font-size:16px;display:flex;align-items:center;justify-content:center}
  .iconbtn .dot{position:absolute;top:-5px;right:-5px;background:var(--red);color:#fff;font-size:10px;font-weight:700;border-radius:10px;min-width:16px;height:16px;display:flex;align-items:center;justify-content:center;padding:0 3px}
  .userchip{display:flex;align-items:center;gap:9px;border:1px solid var(--line);border-radius:10px;padding:4px 8px 4px 4px}
  .avatar{width:28px;height:28px;border-radius:8px;background:var(--navy2);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px}
  .userchip .un{font-size:12.5px;font-weight:600;line-height:1.05}
  .userchip .ur{font-size:10.5px;color:var(--slate)}
  .content{padding:20px;max-width:1200px;width:100%}
  /* ---------- generic ---------- */
  .grid{display:grid;gap:16px}
  .g4{grid-template-columns:repeat(4,1fr)} .g3{grid-template-columns:repeat(3,1fr)} .g2{grid-template-columns:repeat(2,1fr)}
  @media(max-width:900px){.g4{grid-template-columns:repeat(2,1fr)}.g3,.g2{grid-template-columns:1fr}}
  .card{background:var(--card);border:1px solid var(--line);border-radius:13px}
  .card .ch{display:flex;align-items:center;justify-content:space-between;padding:13px 16px;border-bottom:1px solid #eee9df}
  .card .ch h3{margin:0;font-size:13.5px} .card .ch .cs{font-size:11.5px;color:var(--mut)}
  .card .cb{padding:16px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:15px}
  .stat .l{font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--slate);font-weight:600}
  .stat .v{font-size:22px;font-weight:700;margin-top:3px} .stat .d{font-size:11.5px;margin-top:3px;font-weight:600}
  .up{color:#0b7d57} .down{color:var(--red)}
  table{width:100%;border-collapse:collapse}
  th{font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--slate);text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);font-weight:600;white-space:nowrap}
  td{padding:10px 12px;border-bottom:1px solid #f5f1e9;font-size:13px;vertical-align:middle}
  tr:last-child td{border-bottom:0}
  tbody tr:hover{background:#faf7f1}
  th.r,td.r{text-align:right}
  .tag{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;border-radius:20px;padding:2px 9px}
  .t-green{background:#e7f6ef;color:#0b7d57}.t-amber{background:#fef3e2;color:#b45309}.t-red{background:#fdecec;color:#b91c1c}
  .t-sky{background:#e6f2fb;color:#0369a1}.t-violet{background:#f1ebfd;color:#6d28d9}.t-slate{background:#eee9df;color:#475569}
  .dotc{width:8px;height:8px;border-radius:2px;display:inline-block}
  .btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 12px;font-size:12.5px;font-weight:600;color:var(--ink)}
  .btn:hover{background:#faf7f1}
  .btn.p{background:var(--accent);border-color:var(--accent);color:#fff}.btn.p:hover{background:var(--accent-d)}
  .btn.d{color:var(--red);border-color:#f5c9c9}.btn.d:hover{background:#fdf2f2}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .btn.sm{padding:4px 9px;font-size:11.5px}
  .muted{color:var(--slate)} .small{font-size:12px}
  .row{display:flex;align-items:center;gap:10px}.wrap{flex-wrap:wrap}
  .barwrap{height:8px;background:#eee9df;border-radius:6px;overflow:hidden}
  .barwrap>span{display:block;height:100%;border-radius:6px}
  .kv{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed #eee9df;font-size:13px}
  .kv:last-child{border-bottom:0}.kv .k{color:var(--slate)}
  /* drawer + modal */
  .scrim{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:60;display:flex;justify-content:flex-end}
  .drawer{width:520px;max-width:94vw;background:#fff;height:100%;overflow-y:auto;box-shadow:-20px 0 60px rgba(0,0,0,.2)}
  .modal-scrim{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:70;display:flex;align-items:center;justify-content:center;padding:16px}
  .modal{background:#fff;border-radius:16px;max-width:460px;width:100%;box-shadow:0 30px 80px rgba(0,0,0,.3)}
  .dh{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff}
  .dh h3{margin:0;font-size:15px}
  .x{border:0;background:#f5f1e9;border-radius:8px;width:30px;height:30px;font-size:16px;color:var(--slate)}
  .field{margin-bottom:13px}.field label{display:block;font-size:12px;font-weight:600;color:var(--slate);margin-bottom:5px}
  .field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:8px 10px;font-size:13px;font-family:inherit}
  .field input:focus,.field select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(162,130,60,.15)}
  /* toast */
  #toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:100;display:flex;flex-direction:column;gap:8px;align-items:center}
  .toast{background:#0f172a;color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;box-shadow:0 10px 30px rgba(0,0,0,.25);animation:tin .2s}
  @keyframes tin{from{opacity:0;transform:translateY(8px)}}
  /* notif panel */
  .npanel{position:absolute;top:52px;right:120px;width:340px;background:#fff;border:1px solid var(--line);border-radius:13px;box-shadow:0 20px 50px rgba(0,0,0,.18);z-index:50;overflow:hidden}
  .nitem{display:flex;gap:10px;padding:11px 14px;border-bottom:1px solid #f5f1e9;font-size:12.5px}
  .nitem:last-child{border-bottom:0}.nitem .ni{font-size:15px}
  .nitem.unread{background:#f3faf7}
  .perm{display:grid;grid-template-columns:1.4fr repeat(4,1fr);gap:0;font-size:12px}
  .perm div{padding:8px 10px;border-bottom:1px solid #f5f1e9}
  .perm .hd{font-weight:600;color:var(--slate);background:#faf7f1}
  .yes{color:var(--accent-d);font-weight:700}.no{color:var(--mut)}
  .empty{text-align:center;color:var(--mut);padding:30px;font-size:13px}

  /* Additional views reuse the existing card, table and field patterns. */
  .detail-title{font-size:13px;margin:18px 0 8px}
  .company-drawer{width:760px}
  .table-scroll{max-width:100%;overflow-x:auto}.table-scroll table{min-width:640px}
  .kv{gap:12px}.kv>span:last-child{text-align:right}
  .stat .v{overflow-wrap:anywhere}
  .npanel{position:fixed;right:20px;max-width:calc(100vw - 32px);max-height:70vh;overflow-y:auto}
  .content>.card>table{display:block;overflow-x:auto}
  .content>.grid>.card{min-width:0}
  .content>.grid>.card>table{display:block;overflow-x:auto}
  .drawer table{min-width:500px}
  .dh h3{overflow-wrap:anywhere}
  .side .head .s,.side .foot{color:#bcb5a6}
  @media(max-width:1100px){.g3{grid-template-columns:1fr}.g3>.card{grid-column:auto!important}.stat .v{font-size:19px}}
  @media(max-width:700px){.shell{display:block}.side{position:relative;width:100%;height:auto}.side .head{height:52px}nav.menu{display:flex;gap:4px;overflow-x:auto;padding:8px}.navitem{width:auto;white-space:nowrap;margin:0;font-size:12px}.side .foot{display:none}.top{height:auto;min-height:60px;padding:10px 12px;flex-wrap:wrap;gap:8px}.top .userchip{display:none}.content{padding:12px}.grid.g4,.grid.g2{grid-template-columns:1fr}.g3>.card{grid-column:auto!important}.content .grid[style*="repeat(5"]{grid-template-columns:repeat(2,1fr)!important}.company-drawer{width:96vw}.npanel{top:100px}.card .ch{gap:10px;flex-wrap:wrap}.kv{align-items:flex-start}.stat .v{font-size:22px}}

  .entry-modal{max-width:720px;max-height:90vh;overflow-y:auto}.entry-modal .dh{z-index:1}
  .entry-modal .table-scroll table{min-width:560px}
  @media(max-width:700px){.entry-modal .grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<script>
/* ============================ DATA ============================ */
const FX={NGN:1, USD:1/1600, EUR:1/1750}; // canonical stored in NGN
const SYM={NGN:'₦', USD:'$', EUR:'€'};
const SECCLR={'Straight Debt':'#7b8793','Convertible Debt':'#8d7b94','Working Capital':'#708d89','Mezzanine':'#88936d','Equity':'#a2823c'};

const ROLES={
  admin:{name:'System Administrator',desc:'System configuration and user administration',modules:['dashboard','companies','pipeline','investments','finance','valuation','esg','reports','ai','approvals','admin','audit']},
  pm:{name:'Portfolio Management Team',desc:'Portfolio company management, monitoring and governance',modules:['dashboard','companies','pipeline','investments','valuation','esg','reports','ai','approvals','audit']},
  finance:{name:'Finance Team',desc:'Investment setup, invoicing, payments and financial reporting',modules:['dashboard','companies','investments','finance','valuation','esg','reports','ai','approvals','audit']},
  im:{name:'Investment Manager',desc:'Review and approval of investment-related changes',modules:['dashboard','companies','pipeline','investments','valuation','esg','reports','ai','approvals','audit']},
  fm:{name:'Finance Manager',desc:'Review and approval of finance-related changes',modules:['dashboard','finance','investments','reports','ai','approvals','audit']},
  viewer:{name:'Read-only User',desc:'Reporting and enquiry access only',modules:['dashboard','companies','investments','valuation','esg','reports','ai','audit']},
};

const companies=[
  {id:'c1',name:'Delta Solar Manufacturing',ref:'ALLON-PC-001',sector:'Solar Manufacturing',loc:'Port Harcourt, Rivers',status:'Active',risk:'Low',pm:'A. Okafor',
   docs:[{n:'Annual Financial Statements 2025',s:'Submitted'},{n:'Q2 Management Accounts',s:'Submitted'},{n:'Board Meeting Minutes (Jun)',s:'Outstanding'},{n:'ESG Report 2025',s:'Submitted'}]},
  {id:'c2',name:'Riverline Mini-Grids',ref:'ALLON-PC-002',sector:'Mini-grids',loc:'Yenagoa, Bayelsa',status:'Active',risk:'Medium',pm:'I. Bello',
   docs:[{n:'Annual Financial Statements 2025',s:'Submitted'},{n:'Q2 Management Accounts',s:'Overdue'},{n:'Board Meeting Minutes (Jun)',s:'Submitted'},{n:'ESG Report 2025',s:'Outstanding'}]},
  {id:'c3',name:'Creekside Solar Home Systems',ref:'ALLON-PC-003',sector:'Solar Home Systems',loc:'Warri, Delta',status:'Active',risk:'Medium',pm:'A. Okafor',
   docs:[{n:'Annual Financial Statements 2025',s:'Submitted'},{n:'Q2 Management Accounts',s:'Submitted'},{n:'Compliance Report',s:'Outstanding'}]},
  {id:'c4',name:'Green Delta Power',ref:'ALLON-PC-004',sector:'Mini-grids',loc:'Uyo, Akwa Ibom',status:'Active',risk:'Low',pm:'I. Bello',
   docs:[{n:'Annual Financial Statements 2025',s:'Submitted'},{n:'Board Papers (H1)',s:'Submitted'},{n:'ESG Report 2025',s:'Submitted'}]},
  {id:'c5',name:'Coastal C&I Solar',ref:'ALLON-PC-005',sector:'C&I Solar',loc:'Port Harcourt, Rivers',status:'Watchlist',risk:'High',pm:'A. Okafor',
   docs:[{n:'Annual Financial Statements 2025',s:'Overdue'},{n:'Q2 Management Accounts',s:'Outstanding'},{n:'Strategy Document',s:'Outstanding'}]},
  {id:'c6',name:'Mangrove Energy Finance',ref:'ALLON-PC-006',sector:'Solar Asset Finance',loc:'Calabar, Cross River',status:'Active',risk:'Low',pm:'I. Bello',
   docs:[{n:'Annual Financial Statements 2025',s:'Submitted'},{n:'Management Accounts',s:'Submitted'}]},
];

// amounts canonical NGN
let investments=[
  {id:'i1',co:'c1',type:'Straight Debt',ccy:'NGN',amount:120000000,rate:12,tenor:36,disb:'2024-03-15',maturity:'2027-03-15',status:'Performing',nav:112000000},
  {id:'i2',co:'c1',type:'Equity',ccy:'NGN',amount:80000000,own:8,disb:'2023-09-01',status:'Held',nav:104000000},
  {id:'i3',co:'c2',type:'Convertible Debt',ccy:'USD',amount:400000000,rate:8,tenor:24,disb:'2024-06-10',maturity:'2026-06-10',status:'Performing',nav:410000000},
  {id:'i4',co:'c2',type:'Mezzanine',ccy:'NGN',amount:45000000,rate:15,tenor:12,disb:'2025-01-20',maturity:'2026-01-20',status:'Performing',nav:47000000},
  {id:'i5',co:'c3',type:'Straight Debt',ccy:'NGN',amount:60000000,rate:14,tenor:24,disb:'2024-02-01',maturity:'2026-02-01',status:'Watch',nav:56000000},
  {id:'i6',co:'c4',type:'Equity',ccy:'NGN',amount:150000000,own:15,disb:'2022-11-15',status:'Held',nav:235000000},
  {id:'i7',co:'c4',type:'Working Capital',ccy:'NGN',amount:30000000,rate:15,tenor:12,disb:'2025-03-01',maturity:'2026-03-01',status:'Performing',nav:30000000},
  {id:'i8',co:'c5',type:'Straight Debt',ccy:'NGN',amount:90000000,rate:13,tenor:36,disb:'2023-07-01',maturity:'2026-07-01',status:'Arrears',nav:74000000},
  {id:'i9',co:'c6',type:'Convertible Debt',ccy:'NGN',amount:75000000,rate:10,tenor:30,disb:'2024-10-05',maturity:'2027-04-05',status:'Performing',nav:79000000},
];

let invoices=[
  {id:'v1',inv:'i1',co:'c1',no:'INV-2601',due:'2026-09-15',amount:3600000,status:'Paid'},
  {id:'v2',inv:'i1',co:'c1',no:'INV-2609',due:'2026-10-15',amount:3600000,status:'Issued'},
  {id:'v3',inv:'i3',co:'c2',no:'INV-2603',due:'2026-09-10',amount:8000000,status:'Partially Paid'},
  {id:'v4',inv:'i5',co:'c3',no:'INV-2602',due:'2026-08-01',amount:2100000,status:'Overdue'},
  {id:'v5',inv:'i8',co:'c5',no:'INV-2604',due:'2026-07-15',amount:2925000,status:'Overdue'},
  {id:'v6',inv:'i9',co:'c6',no:'INV-2607',due:'2026-10-05',amount:1875000,status:'Draft'},
];

let approvals=[
  {id:'a1',kind:'investment',title:'Risk rating change, Riverline Mini-Grids: Medium to High',by:'A. Okafor (PM)',apply:()=>{companies.find(c=>c.id==='c2').risk='High';},im:false,fm:false,ts:'2026-09-24'},
  {id:'a2',kind:'finance',title:'Interest rate change, Creekside Solar Home Systems: 14% to 13.5%',by:'Finance Team',apply:()=>{investments.find(i=>i.id==='i5').rate=13.5;},im:false,fm:false,ts:'2026-09-25'},
];
let audit=[
  {ts:'2026-09-25 14:20',user:'Finance Team',act:'Submitted interest-rate amendment for Creekside Solar Home Systems for approval'},
  {ts:'2026-09-24 09:05',user:'A. Okafor (PM)',act:'Submitted risk-rating change for GVE for approval'},
  {ts:'2026-09-22 16:40',user:'Finance Team',act:'Recorded payment against INV-2601 (Delta Solar Manufacturing)'},
  {ts:'2026-09-20 11:12',user:'System Administrator',act:'Created user account for Read-only User'},
];
let notifications=[
  {id:'n1',ic:'',txt:'INV-2604 (Coastal C&I Solar) is overdue by 42 days',read:false},
  {id:'n2',ic:'',txt:'GVE Q2 Management Accounts submission is overdue',read:false},
  {id:'n3',ic:'',txt:'2 changes awaiting your approval',read:false},
];

/* ============================ STATE ============================ */
const S={user:null, role:null, view:'dashboard', ccy:'NGN', drawer:null, modal:null, notifOpen:false, aiOpen:false, chat:[], mcp:{claude:false,chatgpt:false}, commentary:null};
const co=id=>companies.find(c=>c.id===id);
const coName=id=>{const c=co(id);return c?c.name:id};

/* ============================ HELPERS ============================ */
function money(ngn,digits){const v=ngn*FX[S.ccy];const s=SYM[S.ccy];
  if(Math.abs(v)>=1e6&&digits!=='full'){return s+(v/1e6).toLocaleString('en-US',{maximumFractionDigits:1})+'M'}
  return s+Math.round(v).toLocaleString('en-US')}
function moneyFull(ngn){return SYM[S.ccy]+Math.round(ngn*FX[S.ccy]).toLocaleString('en-US')}
const sum=(a,f)=>a.reduce((s,x)=>s+f(x),0);
function riskTag(r){const m={Low:'t-green',Medium:'t-amber',High:'t-red'};return `<span class="tag ${m[r]||'t-slate'}">${r}</span>`}
function statusTag(s){const m={Performing:'t-green',Held:'t-sky',Watch:'t-amber',Arrears:'t-red',Active:'t-green',Watchlist:'t-amber',
  Paid:'t-green',Issued:'t-sky','Partially Paid':'t-amber',Overdue:'t-red',Draft:'t-slate',Cancelled:'t-slate',
  Submitted:'t-green',Outstanding:'t-amber',Compliant:'t-green',Closed:'t-green',Open:'t-amber',Due:'t-slate',Scheduled:'t-slate',Planned:'t-slate'};return `<span class="tag ${m[s]||'t-slate'}">${s}</span>`}
function secDot(t){return `<span class="dotc" style="background:${SECCLR[t]||'#64748b'}"></span>`}
function can(action){
  const r=S.role;
  if(action==='editCompany')return r==='pm'||r==='admin';
  if(action==='editFinance')return r==='finance'||r==='admin';
  if(action==='approveInv')return r==='im'||r==='admin';
  if(action==='approveFin')return r==='fm'||r==='admin';
  if(action==='invoice')return r==='finance'||r==='admin';
  if(action==='admin')return r==='admin';
  return false;
}
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.getElementById('toast').appendChild(t);setTimeout(()=>t.remove(),2600)}

/* charts */
function donut(segs,size){size=size||150;const r=size/2-14,cx=size/2,cy=size/2,C=2*Math.PI*r;let off=0;const tot=sum(segs,s=>s.value)||1;
  let circles=segs.map(s=>{const frac=s.value/tot;const dash=frac*C;const el=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${s.color}" stroke-width="16" stroke-dasharray="${dash} ${C-dash}" stroke-dashoffset="${-off}" transform="rotate(-90 ${cx} ${cy})"/>`;off+=dash;return el}).join('');
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">${circles}<circle cx="${cx}" cy="${cy}" r="${r-14}" fill="#fff"/></svg>`}
function linechart(vals,w,h){w=w||520;h=h||150;const pad=8;const mx=Math.max(...vals),mn=Math.min(...vals);const rng=(mx-mn)||1;
  const pts=vals.map((v,i)=>{const x=pad+i*(w-2*pad)/(vals.length-1);const y=h-pad-((v-mn)/rng)*(h-2*pad);return [x,y]});
  const poly=pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  const area=`${pad},${h-pad} `+poly+` ${w-pad},${h-pad}`;
  return `<svg width="100%" height="${h}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><polygon points="${area}" fill="rgba(162,130,60,.10)"/><polyline points="${poly}" fill="none" stroke="#a2823c" stroke-width="2.5"/></svg>`}
function hbars(items){const mx=Math.max(...items.map(i=>i.v))||1;
  return items.map(i=>`<div style="margin-bottom:9px"><div class="row" style="justify-content:space-between;font-size:12px;margin-bottom:3px"><span class="muted">${i.l}</span><span class="mono" style="font-weight:600">${i.d||money(i.v)}</span></div><div class="barwrap"><span style="width:${Math.max(4,i.v/mx*100)}%;background:${i.c||'#a2823c'}"></span></div></div>`).join('')}

/* ---- metrics ---- */
function metrics(){
  const nav=sum(investments,i=>i.nav);
  const cost=sum(investments,i=>i.amount);
  const debt=investments.filter(i=>i.type!=='Equity');
  const eq=investments.filter(i=>i.type==='Equity');
  const outstanding=sum(invoices.filter(v=>['Issued','Partially Paid','Overdue'].includes(v.status)),v=>v.amount);
  const overdue=invoices.filter(v=>v.status==='Overdue').length;
  const byType={};investments.forEach(i=>byType[i.type]=(byType[i.type]||0)+i.nav);
  return {nav,cost,debtNav:sum(debt,i=>i.nav),eqNav:sum(eq,i=>i.nav),outstanding,overdue,byType,
    unreal:nav-cost, docsOut:sum(companies,c=>c.docs.filter(d=>d.s!=='Submitted').length)}
}

  const trend=[100,101,103,102,105,108,110,109,112,115,117,119];

  // role-tailored strapline + stat set

  if(S.role==='finance'||S.role==='fm'){
    stats=[['Fund NAV',money(m.nav),'+'+((m.unreal/m.cost)*100).toFixed(1)+'% on cost','up'],
      ['Outstanding invoices',money(m.outstanding),m.overdue+' overdue','down'],

/* ---- approvals (dual sign-off) ---- */
function approvalsView(){
  if(!approvals.length)return `<div class="card"><div class="empty">No changes awaiting approval. Everything is up to date.</div></div>`;
  const rows=approvals.map(a=>{
    const needRole=a.kind==='investment'?'Investment Manager':'Finance Manager';
    const imBtn=`<span class="tag ${a.im?'t-green':'t-slate'}">IM ${a.im?'✓':'pending'}</span>`;
    const fmBtn=`<span class="tag ${a.fm?'t-green':'t-slate'}">FM ${a.fm?'✓':'pending'}</span>`;
    let action='';
    if(can('approveInv')&&!a.im)action+=`<button class="btn sm p" onclick="approve('${a.id}','im')">Approve as IM</button>`;
    if(can('approveFin')&&!a.fm)action+=`<button class="btn sm p" onclick="approve('${a.id}','fm')">Approve as FM</button>`;
    if((can('approveInv')||can('approveFin')))action+=`<button class="btn sm d" onclick="reject('${a.id}')">Reject</button>`;
    if(!action)action=`<span class="muted small">Both sign-offs required</span>`;
    return `<tr><td><div style="font-weight:600">${a.title}</div><div class="muted small">${a.kind==='investment'?'Investment-related':'Finance-related'} · by ${a.by} · ${a.ts}</div></td>
      <td class="row" style="gap:6px">${imBtn}${fmBtn}</td><td class="r"><div class="row wrap" style="justify-content:flex-end">${action}</div></td></tr>`}).join('');
  return `<div class="card"><div class="ch"><div><h3>Pending approvals</h3></div></div>
    <table><thead><tr><th>Change</th><th>Sign-off</th><th class="r">Action</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}
function approve(id,as){const a=approvals.find(x=>x.id===id);if(!a)return;a[as]=true;logAudit(`${as.toUpperCase()} approved: ${a.title}`);
  if(a.im&&a.fm){a.apply();logAudit(`Change effective (both approvals obtained): ${a.title}`);notify('Change applied: '+a.title,'');approvals=approvals.filter(x=>x.id!==id);toast('Both approvals in, change applied')}
  else{toast('Approved. Awaiting the other sign-off.')}
  render();
}
function reject(id){const a=approvals.find(x=>x.id===id);approvals=approvals.filter(x=>x.id!==id);logAudit(`Rejected change: ${a.title}`);toast('Change rejected');render()}

function toggleAI(){S.aiOpen=!S.aiOpen;render();if(S.aiOpen)setTimeout(()=>{const c=document.getElementById('chatbox');if(c)c.scrollTop=c.scrollHeight},40)}

function answerAI(q){
  const s=q.toLowerCase();const m=metrics();
  if(s.includes('overdue')){const ov=invoices.filter(v=>v.status==='Overdue');if(!ov.length)return 'No invoices are currently overdue.';return `There ${ov.length===1?'is':'are'} <b>${ov.length}</b> overdue invoice${ov.length>1?'s':''}, totalling <b>${money(sum(ov,v=>v.amount))}</b>:<br>`+ov.map(v=>`\u2022 ${v.no} \u00B7 ${coName(v.co).split(' (')[0]} \u00B7 ${money(v.amount)} (due ${v.due})`).join('<br>')}
  if((s.includes('outstanding')||s.includes('report')||s.includes('document'))&&!s.includes('invoice')){const cs=companies.filter(c=>c.docs&&c.docs.some(d=>d.s!=='Submitted'));return `<b>${cs.length}</b> companies have outstanding or overdue reports:<br>`+cs.map(c=>`\u2022 ${c.name.split(' (')[0]} \u00B7 ${c.docs.filter(d=>d.s!=='Submitted').map(d=>d.n).join(', ')}`).join('<br>')}
  if(s.includes('nav')||s.includes('value')||s.includes('worth')){return `Total portfolio NAV is <b>${moneyFull(m.nav)}</b> against committed cost of <b>${moneyFull(m.cost)}</b>, an unrealised gain of <b>${moneyFull(m.unreal)}</b> (+${(m.unreal/m.cost*100).toFixed(1)}%). Debt is ${Math.round(m.debtNav/m.nav*100)}% and equity ${Math.round(m.eqNav/m.nav*100)}% of NAV.`}
  if(s.includes('risk')||s.includes('arrears')||s.includes('watch')){const hi=investments.filter(i=>['Arrears','Watch'].includes(i.status));const hc=companies.filter(c=>c.risk==='High');return `<b>${hc.length}</b> high-risk company (${hc.map(c=>c.name.split(' (')[0]).join(', ')||'none'}) and <b>${hi.length}</b> investment${hi.length>1?'s':''} in arrears/watch:<br>`+hi.map(i=>`\u2022 ${coName(i.co).split(' (')[0]} \u00B7 ${i.type} \u00B7 ${i.status} (NAV ${money(i.nav)})`).join('<br>')}
  if(s.includes('exposure')||s.includes('concentration')||s.includes('biggest')||s.includes('largest')){const by=companies.map(c=>({n:c.name.split(' (')[0],v:sum(investments.filter(i=>i.co===c.id),i=>i.nav)})).sort((a,b)=>b.v-a.v);return `Largest exposures by NAV:<br>`+by.slice(0,4).map(x=>`\u2022 ${x.n} \u00B7 ${money(x.v)} (${(x.v/m.nav*100).toFixed(0)}%)`).join('<br>')}
  if(s.includes('approval')||s.includes('pending')){if(!approvals.length)return 'No changes are awaiting approval.';return `<b>${approvals.length}</b> change${approvals.length>1?'s':''} awaiting approval:<br>`+approvals.map(a=>`\u2022 ${a.title} (${a.im?'IM \u2713':'IM pending'}, ${a.fm?'FM \u2713':'FM pending'})`).join('<br>')}
  if(s.includes('interest')||s.includes('income')){return `Interest income year-to-date is <b>${money(28400000)}</b>, running +6.2% against plan. The next interest run regenerates invoices from current repayment schedules.`}
  if(s.includes('impact')||s.includes('esg')||s.includes('co2')||s.includes('carbon')||s.includes('energy')||s.includes('women')){const mwh=Object.values(esgData).reduce((a,b)=>a+b.mwh,0);const co2=Object.values(esgData).reduce((a,b)=>a+b.co2,0);const conn=Object.values(esgData).reduce((a,b)=>a+b.conn,0);return `Portfolio impact to date: <b>${mwh.toLocaleString()} MWh</b> clean energy delivered, <b>${co2.toLocaleString()} t</b> CO\u2082 avoided, and <b>${conn.toLocaleString()}</b> people/connections served across ${companies.length} companies.`}
  return `I answer from your live portfolio data. Try: overdue invoices, total NAV, outstanding company reports, high-risk investments, largest exposures, pending approvals, interest income, or impact metrics. In production I connect to Claude or ChatGPT through an MCP server so your team can ask these from their own AI assistant.`;
}

function saveEntry(){if(!entryAllowed(entryDraft.kind))return;const d={...entryDraft,id:'draft-'+Date.now(),status:'Draft'};demoDrafts[d.kind==='company'?'companies':d.kind==='investment'?'investments':'deals'].push(d);const target=d.kind==='company'?'companies':d.kind==='investment'?'investments':'pipeline';closeModal();S.drawer=null;go(target);toast('Draft saved. View it in the draft list below.');entryDraft={}}
function draftsHTML(kind){const rows=demoDrafts[kind];if(!rows.length)return '';return `<div class="card" style="margin-top:16px"><div class="ch"><div><h3>Draft ${kind}</h3><span class="cs">Session entries. Separate from the seeded portfolio.</span></div><span class="tag t-slate">${rows.length} drafts</span></div><div class="table-scroll"><table><thead><tr><th>Company</th><th>Details</th><th>Status</th></tr></thead><tbody>${rows.map(d=>`<tr><td>${safeText(d.name||d.company)}</td><td>${safeText(kind==='companies'?d.sector+' · '+d.location:kind==='investments'?d.type+' · '+nativeMoney(Number(d.amount),d.currency):d.stage+' · '+nativeMoney(Number(d.amount),d.currency))}</td><td><span class="tag t-slate">Draft</span></td></tr>`).join('')}</tbody></table></div></div>`}
function openImport(){if(!can('editFinance')){toast('Switch to Finance Team or System Administrator to prepare imports.');return}importPreview=null;entryModal('Import investment schedule',`<p class="muted small">Choose an Excel, CSV or PDF schedule, then review the records before creating drafts.</p><div class="field"><label for="import-file">Investment schedule</label><input id="import-file" type="file" accept=".xlsx,.xls,.csv,.pdf" onchange="selectImportFile(this)"></div><p id="import-status" class="muted small" role="status">No file selected. Files stay on this device.</p><div class="row wrap"><button class="btn sm" onclick="downloadImportTemplate()">Download sample CSV</button><button class="btn sm" onclick="showImportPreview('Atlas_sample_schedule.csv',true)">Use sample schedule</button></div><p class="muted small">Demo extraction shows two sample records. It does not read the contents of your uploaded file.</p>`,`<button class="btn" onclick="closeModal()">Cancel</button><button id="extract-button" class="btn p" disabled onclick="showImportPreview(importPreview.filename,false)">Preview extraction</button>`)}
function selectImportFile(input){const file=input.files[0];if(!file)return;const status=document.getElementById('import-status');if(!/\.(xlsx|xls|csv|pdf)$/i.test(file.name)){status.textContent='Choose an Excel, CSV or PDF file.';document.getElementById('extract-button').disabled=true;return}importPreview={filename:file.name};status.textContent=file.name+' · '+Math.max(1,Math.round(file.size/1024))+' KB. Ready for sample preview.';document.getElementById('extract-button').disabled=false}
function showImportPreview(filename,sample){importPreview={filename,rows:[{company:'Riverline Mini-Grids',type:'Straight Debt',currency:'NGN',amount:110000000,date:'2026-10-09'},{company:'Green Delta Power',type:'Equity',currency:'USD',amount:100000,date:'2026-10-09'}]};entryModal('Review extracted records',`<p class="muted small">${safeText(filename)}</p><span class="tag t-amber">${sample?'Sample schedule':'Simulated extraction'}</span><p class="small">Review 2 sample records. ${sample?'These records come from the built-in sample schedule.':'These records are illustrative, not extracted from the selected file.'}</p><div class="table-scroll"><table><thead><tr><th>Company</th><th>Security</th><th class="r">Amount</th><th>Check</th></tr></thead><tbody>${importPreview.rows.map(r=>`<tr><td>${r.company}</td><td>${r.type}</td><td class="r mono">${nativeMoney(r.amount,r.currency)}</td><td><span class="tag t-green">Ready</span></td></tr>`).join('')}</tbody></table></div><p class="muted small">Creates two session drafts. Portfolio totals remain unchanged.</p>`,`<button class="btn" onclick="openImport()">Back</button><button class="btn p" onclick="confirmImport()">Create 2 drafts</button>`)}
function confirmImport(){if(!can('editFinance'))return;if(!importPreview||!importPreview.rows){showImportPreview('Atlas_sample_schedule.csv',true);return}importPreview.rows.forEach((r,index)=>demoDrafts.investments.push({...r,id:'import-'+Date.now()+'-'+index,status:'Draft'}));importPreview=null;closeModal();go('investments');toast('2 investment drafts created. Portfolio totals unchanged.')}
function downloadImportTemplate(){downloadCSV('Atlas_sample_schedule.csv',[['Company','Security type','Currency','Amount','Investment date'],['Riverline Mini-Grids','Straight Debt','NGN',110000000,DEMO_DATE],['Green Delta Power','Equity','USD',100000,DEMO_DATE]])}
const baseCompaniesView=companiesView;companiesView=()=>`<p class="muted small">Select a company to view its profile, documents and governance. Add a company to prepare a new draft.</p>`+baseCompaniesView()+draftsHTML('companies');
const baseInvestmentsView=investmentsView;investmentsView=()=>`<p class="muted small">Review holdings, add an investment, or import a schedule. New entries are kept as drafts.</p>`+baseInvestmentsView()+draftsHTML('investments');
const basePipelineView=pipelineView;pipelineView=()=>basePipelineView()+draftsHTML('deals');

/* Session-only administration demonstrator. */
const adminUsers=[
 {id:'u1',name:'Olu Adeyemi',email:'olu.adeyemi@allon.example',role:'admin',status:'Active'},
 {id:'u2',name:'Amaka Okafor',email:'amaka.okafor@allon.example',role:'pm',status:'Active'},
 {id:'u3',name:'Chidinma Eze',email:'chidinma.eze@allon.example',role:'finance',status:'Active'},
 {id:'u4',name:'Jibril Musa',email:'jibril.musa@allon.example',role:'im',status:'Active'},
 {id:'u5',name:'Binta Danladi',email:'binta.danladi@allon.example',role:'fm',status:'Active'},
 {id:'u6',name:'Board Viewer',email:'board.viewer@allon.example',role:'viewer',status:'Active'}
];
const ROLE_CAPABILITIES=[
 {label:'View portfolio, reports and audit',roles:['admin','pm','finance','im','fm','viewer']},
 {label:'Manage companies and governance',roles:['admin','pm']},
 {label:'Prepare investments, invoices and imports',roles:['admin','finance']},
 {label:'Approve as Investment Manager',roles:['admin','im']},
 {label:'Approve as Finance Manager',roles:['admin','fm']},
 {label:'Add users and assign roles',roles:['admin']},
 {label:'Deactivate, reactivate and delete users',roles:['admin']}
];
function adminView(){if(!can('admin'))return '<div class="card"><div class="empty">User administration is available to the System Administrator.</div></div>';
 const active=adminUsers.filter(u=>u.status==='Active').length;
 return `<div class="card" style="margin-bottom:16px"><div class="ch"><div><h3>System Administrator workspace</h3><span class="cs">Access, roles and user lifecycle</span></div><span class="tag t-slate">Administrator only</span></div><div class="cb"><p class="small" style="margin:0">Add users, assign any of the six roles, and manage account access. Use Manage to change a role, deactivate access or delete an account.</p><p class="muted small" style="margin-bottom:0">Demo changes apply to this session and appear in the audit trail. Role sign-in cards remain available for the presentation.</p></div></div>
 <div class="grid g3" style="margin-bottom:16px"><div class="stat"><div class="l">User accounts</div><div class="v">${adminUsers.length}</div></div><div class="stat"><div class="l">Active accounts</div><div class="v">${active}</div></div><div class="stat"><div class="l">Available roles</div><div class="v">6</div></div></div>
 <div class="card"><div class="ch"><h3>User directory</h3><button class="btn p sm" onclick="openUser()">+ Add user</button></div><div class="table-scroll"><table><thead><tr><th>User</th><th>Assigned role</th><th>Access</th><th class="r">Action</th></tr></thead><tbody>${adminUsers.map(u=>`<tr><td><strong>${safeText(u.name)}</strong><div class="muted small">${safeText(u.email)}</div></td><td>${ROLES[u.role].name}</td><td><span class="tag ${u.status==='Active'?'t-green':'t-slate'}">${u.status}</span></td><td class="r"><button class="btn sm" onclick="openUser('${u.id}')">Manage</button></td></tr>`).join('')}</tbody></table></div></div>
 <div class="card" style="margin-top:16px"><div class="ch"><h3>Roles and permissions</h3><span class="cs">IM and FM are separate approval responsibilities</span></div><div class="table-scroll"><table><thead><tr><th>Capability</th>${Object.values(ROLES).map(r=>`<th>${r.name}</th>`).join('')}</tr></thead><tbody>${ROLE_CAPABILITIES.map(c=>`<tr><td>${c.label}</td>${Object.keys(ROLES).map(r=>`<td><span class="${c.roles.includes(r)?'yes':'no'}">${c.roles.includes(r)?'Allowed':'View only / unavailable'}</span></td>`).join('')}</tr>`).join('')}</tbody></table></div></div>
 <div class="grid g3" style="margin-top:16px">${Object.entries(ROLES).map(([key,r])=>`<div class="card"><div class="ch"><h3>${r.name}</h3></div><div class="cb"><p class="muted small" style="margin-top:0">${r.desc}</p><span class="tag t-slate">${adminUsers.filter(u=>u.role===key).length} assigned users</span></div></div>`).join('')}</div>`;
}
function openUser(id){if(!can('admin'))return;const u=adminUsers.find(x=>x.id===id);if(id&&!u)return;
 entryModal(u?'Manage user':'Add user',`<form id="user-form" onsubmit="event.preventDefault();saveUser('${u?u.id:''}')"><div class="grid g2">${entryField('Full name','user-name',u?u.name:'')}${entryField('Email address','user-email',u?u.email:'','email')}</div><div class="field"><label for="user-role">Assigned role</label><select id="user-role">${Object.entries(ROLES).map(([k,r])=>`<option value="${k}" ${k===(u?u.role:'viewer')?'selected':''}>${r.name}</option>`).join('')}</select></div><div class="field"><label for="user-status">Account access</label><select id="user-status"><option ${!u||u.status==='Active'?'selected':''}>Active</option><option ${u&&u.status==='Inactive'?'selected':''}>Inactive</option></select></div><p class="muted small">Inactive accounts represent revoked access. At least one active System Administrator must remain.</p><p id="user-error" class="down small" role="alert"></p></form>`,` ${u?`<button class="btn d" onclick="confirmDeleteUser('${u.id}')">Delete user</button>`:''}<button class="btn" onclick="closeModal()">Cancel</button><button class="btn p" type="submit" form="user-form">${u?'Save changes':'Add user'}</button>`);
}
function lastAdmin(u,nextRole,nextStatus){return u&&u.role==='admin'&&u.status==='Active'&&(nextRole!=='admin'||nextStatus!=='Active')&&adminUsers.filter(x=>x.role==='admin'&&x.status==='Active').length===1}
function saveUser(id){if(!can('admin'))return;const form=document.getElementById('user-form');if(!form.reportValidity())return;
 const u=adminUsers.find(x=>x.id===id);if(id&&!u)return;
 const name=document.getElementById('user-name').value.trim(),email=document.getElementById('user-email').value.trim(),role=document.getElementById('user-role').value,status=document.getElementById('user-status').value;
 const error=document.getElementById('user-error');if(!name){error.textContent='Enter a full name.';return}if(!ROLES[role]||!['Active','Inactive'].includes(status))return;
 if(adminUsers.some(x=>x.id!==id&&x.email.toLowerCase()===email.toLowerCase())){error.textContent='A user with this email already exists.';return}if(lastAdmin(u,role,status)){error.textContent='Keep at least one active System Administrator.';return}
 if(u){logAudit('Updated demo user '+safeText(name)+': '+ROLES[u.role].name+' to '+ROLES[role].name+', access '+u.status+' to '+status);Object.assign(u,{name,email,role,status})}else{adminUsers.push({id:'u'+Date.now(),name,email,role,status});logAudit('Added demo user '+safeText(name)+' with role '+ROLES[role].name)}closeModal();go('admin');toast('User directory updated for this demo session.');
}
function confirmDeleteUser(id){if(!can('admin'))return;const u=adminUsers.find(x=>x.id===id);if(!u)return;if(lastAdmin(u,'viewer','Inactive')){toast('Keep at least one active System Administrator.');return}
 entryModal('Delete user',`<p>Remove <strong>${safeText(u.name)}</strong> from the demo user directory?</p><p class="muted small">${safeText(u.email)}. ${ROLES[u.role].name}.</p><p class="muted small">This removes the session account entry. The audit history is retained.</p>`,`<button class="btn" onclick="openUser('${id}')">Cancel</button><button class="btn d" onclick="deleteUser('${id}')">Delete user</button>`);
}
function deleteUser(id){if(!can('admin'))return;const u=adminUsers.find(x=>x.id===id);if(!u||lastAdmin(u,'viewer','Inactive'))return;adminUsers.splice(adminUsers.indexOf(u),1);logAudit('Deleted demo user '+safeText(u.name));closeModal();go('admin');toast('User removed from the demo directory.');}

/* boot */
render();
</script>
</body>
</html>
